---
- name: Ensure apps owner exists (docker group, no sudo)
  ansible.builtin.user:
    name: "{{ apps_owner }}"
    system: true
    shell: /bin/bash
    groups: docker
    append: true

# 録画プールが本当にマウントされているかを確認する。未マウントのまま進むと
# /srv/recordings 配下が OS ディスク上の普通のディレクトリとして作られ、録画が OS ディスクを埋める
- name: Read recording pool mount
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, FSTYPE, --mountpoint, "{{ recording_pool_mountpoint }}"]
  register: apps_recording_mount
  changed_when: false
  failed_when: false

- name: Assert recording pool is mounted
  ansible.builtin.assert:
    that:
      - apps_recording_mount.rc == 0
      - apps_recording_mount.stdout | trim == apps_recording_fstype
    fail_msg: >-
      {{ recording_pool_mountpoint }} が {{ apps_recording_fstype }} としてマウントされていない
      （現在: {{ apps_recording_mount.stdout | trim | default('未マウント', true) }}）。
      recording_disks を設定して storage ロールを通すか、検証用途なら apps_require_recording_mount: false にする
    quiet: true
  when: apps_require_recording_mount | bool

# /opt は root 所有なので、非 root の apps_owner が clone できるよう先に作って渡す
- name: Create checkout directory
  ansible.builtin.file:
    path: "{{ apps_checkout_dir }}"
    state: directory
    owner: "{{ apps_owner }}"
    group: "{{ apps_owner }}"
    mode: "0755"

- name: Check out this repository on the recorder
  ansible.builtin.git:
    repo: "{{ apps_repo_url }}"
    dest: "{{ apps_checkout_dir }}"
    version: "{{ apps_repo_version }}"
    update: true
  become: true
  become_user: "{{ apps_owner }}"

- name: Ensure runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ apps_owner }}"
    group: "{{ apps_owner }}"
    mode: "0775"
  loop:
    - "{{ apps_compose_dir }}/data"
    - "{{ apps_compose_dir }}/data/mirakurun"
    - "{{ apps_compose_dir }}/data/epgstation"
    - "{{ apps_compose_dir }}/data/mariadb"
    - "{{ recording_pool_mountpoint }}/recorded"
    - "{{ recording_pool_mountpoint }}/thumbnail"

- name: Create .env from example when missing
  ansible.builtin.copy:
    src: "{{ apps_compose_dir }}/.env.example"
    dest: "{{ apps_compose_dir }}/.env"
    remote_src: true
    force: false
    owner: "{{ apps_owner }}"
    mode: "0640"

- name: Start recorder stack
  ansible.builtin.shell: docker compose pull --quiet && docker compose up -d --remove-orphans
  args:
    chdir: "{{ apps_compose_dir }}"
  become: true
  become_user: "{{ apps_owner }}"
  when: apps_start_on_configure | bool
  changed_when: true
