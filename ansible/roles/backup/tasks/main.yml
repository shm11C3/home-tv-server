---
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0750"

- name: Install backup script
  ansible.builtin.template:
    src: backup-epgstation-db.sh.j2
    dest: /usr/local/bin/backup-epgstation-db
    mode: "0750"

- name: Install backup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-epgstation-db.service
    mode: "0644"
    content: |
      [Unit]
      Description=Dump EPGStation database
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup-epgstation-db

- name: Install backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/backup-epgstation-db.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Nightly EPGStation database dump

      [Timer]
      OnCalendar={{ backup_on_calendar }}
      Persistent=true
      RandomizedDelaySec=10m

      [Install]
      WantedBy=timers.target

- name: Enable backup timer
  ansible.builtin.systemd:
    name: backup-epgstation-db.timer
    enabled: true
    state: started
    daemon_reload: true
