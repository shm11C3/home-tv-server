# Mirakurun のチューナー定義。チューナー選定後に実機へ合わせる
# PLEX PX-W3U4 / px4_drv の例: 地上波（GR）x2 + 衛星（BS/CS）x2
---
- name: PX4-S1
  types: [BS, CS]
  command: recpt1 --device /dev/px4video0 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: true
- name: PX4-S2
  types: [BS, CS]
  command: recpt1 --device /dev/px4video1 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: true
- name: PX4-T1
  types: [GR]
  command: recpt1 --device /dev/px4video2 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: true
- name: PX4-T2
  types: [GR]
  command: recpt1 --device /dev/px4video3 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: true
