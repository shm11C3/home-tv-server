# CI: third-party action はすべてコミット SHA で pin し、更新は Dependabot に任せる
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.x
      - name: fmt
        run: tofu -chdir=infra/proxmox fmt -check -recursive -diff
      - name: init (no backend)
        run: tofu -chdir=infra/proxmox init -backend=false -input=false
      - name: validate
        run: tofu -chdir=infra/proxmox validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install --disable-pip-version-check ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint -s .
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check (example inventory)
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check -i inventory/hosts.example.yml site.yml
          ansible-playbook --syntax-check -i inventory/hosts.example.yml proxmox-host.yml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose config
        working-directory: apps/recorder
        run: cp .env.example .env && docker compose config --quiet

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum verified)
        # リポジトリの Actions 設定で第三者 action を絞っているため、Docker action ではなく
        # リリースバイナリを checksums.txt で検証してから使う
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${tarball}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint -color
